<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Information System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- =========================================
             HEADER
        ========================================== -->

        <header class="main-header">

            <div>
                <h1>Student Information System</h1>
                <p>Manage student records efficiently</p>
            </div>

            <div class="header-status">
                <span class="status-dot"></span>
                <span>System Online</span>
            </div>

        </header>


        <!-- =========================================
             STUDENT FORM
        ========================================== -->

        <section class="form-card">

            <div class="section-header">

                <div>
                    <h2 id="formTitle">Add Student</h2>
                    <p>Enter the student's information below.</p>
                </div>

            </div>


            <form id="studentForm">

                <!-- Hidden row value used when editing -->
                <input
                    type="hidden"
                    id="studentId"
                >


                <!-- FIRST NAME -->

                <div class="form-group">

                    <label for="firstName">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter first name"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- LAST NAME -->

                <div class="form-group">

                    <label for="lastName">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter last name"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- COURSE -->

                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <input
                        type="text"
                        id="course"
                        placeholder="e.g. BSIT"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- YEAR LEVEL -->

                <div class="form-group">

                    <label for="yearLevel">
                        Year Level
                    </label>

                    <select
                        id="yearLevel"
                        required
                    >

                        <option value="">
                            Select Year
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                    </select>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="student@example.com"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- FORM BUTTONS -->

                <div class="buttons">

                    <!-- CREATE / UPDATE -->

                    <button
                        type="submit"
                        class="btn-primary"
                        id="saveBtn"
                    >
                        Add Student
                    </button>


                    <!-- CANCEL EDIT -->

                    <button
                        type="button"
                        class="btn-secondary"
                        id="cancelBtn"
                        onclick="cancelEdit()"
                        style="display: none;"
                    >
                        Cancel
                    </button>


                    <!-- CLEAR FORM -->

                    <button
                        type="button"
                        class="btn-light"
                        id="clearBtn"
                        onclick="clearForm()"
                    >
                        Clear
                    </button>

                </div>

            </form>

        </section>



        <!-- =========================================
             STUDENT RECORDS
        ========================================== -->

        <section class="table-card">

            <!-- TABLE HEADER -->

            <div class="table-header">

                <div>

                    <h2>
                        Student Records
                    </h2>

                    <p>
                        View, edit, and delete student records.
                    </p>

                </div>


                <div class="table-controls">

                    <!-- SEARCH -->

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search student..."
                        autocomplete="off"
                        onkeyup="searchStudents()"
                    >


                    <!-- REFRESH -->

                    <button
                        type="button"
                        class="btn-refresh"
                        onclick="loadStudents()"
                    >
                        ↻ Refresh
                    </button>

                </div>

            </div>



            <!-- TABLE -->

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>
                                First Name
                            </th>

                            <th>
                                Last Name
                            </th>

                            <th>
                                Course
                            </th>

                            <th>
                                Year Level
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="studentTableBody">

                        <!--
                            JavaScript will automatically
                            insert student records here.
                        -->

                        <tr>

                            <td
                                colspan="7"
                                style="text-align: center;"
                            >
                                Loading student records...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>


        <!-- =========================================
             FOOTER
        ========================================== -->

        <footer>

            <p>
                Student Information System
            </p>

        </footer>

    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js"></script>

</body>
</html>
